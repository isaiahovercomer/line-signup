<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>活動報名</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --green:#06C755; --bg:#f4f6f8; --card:#fff; --text:#222; --muted:#777; --line:#e3e6ea; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:16px; }
  #app { max-width:520px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .center { text-align:center; }
  .icon { font-size:48px; margin-bottom:6px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:18px; margin:0 0 8px; }
  p { line-height:1.6; margin:6px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .warn { color:#c0392b; background:#fdecea; padding:10px; border-radius:8px; font-size:14px; }
  label { display:block; font-size:14px; color:var(--muted); margin-top:12px; }
  input, textarea { width:100%; margin-top:4px; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; font-size:16px; font-weight:600; background:#e9ecef; color:var(--text); }
  button.primary { background:var(--green); color:#fff; }
  button:disabled { opacity:.6; }
  .row { display:flex; gap:8px; }
  .row button { margin-top:10px; padding:10px; font-size:14px; }
  code { display:block; word-break:break-all; background:#f1f3f5; padding:10px; border-radius:8px; margin:10px 0; font-size:13px; }
  .spinner { width:36px; height:36px; border:4px solid #dfe3e7; border-top-color:var(--green); border-radius:50%; margin:10px auto; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* 圖卡預覽 */
  .preview { border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:6px; }
  .preview img { width:100%; aspect-ratio:20/13; object-fit:cover; display:block; }
  .preview .pv-body { padding:14px; }
  .preview .pv-title { font-weight:700; font-size:18px; }
  .preview .pv-meta { color:var(--muted); font-size:13px; margin-top:6px; }
  .preview .pv-btn { margin:0 14px 14px; background:var(--green); color:#fff; text-align:center; padding:10px; border-radius:8px; font-weight:600; }
  .ev { border-top:1px solid var(--line); padding:12px 0; }
  .ev:first-of-type { border-top:0; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#e8f8ee; color:#058a3c; margin-left:6px; }
  .badge.off { background:#f1f3f5; color:#888; }
</style>
</head>
<body>
<div id="app"><div class="card center"><div class="spinner"></div><p class="muted">載入中…</p></div></div>

<script>
/* ======== 只需要改這兩行 ======== */
const LIFF_ID = '請填入 LIFF ID';
const GAS_URL = '請填入 Apps Script 網頁應用程式網址';
/* ================================ */

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const view = html => { $app.innerHTML = html; };
const loading = msg => `<div class="card center"><div class="spinner"></div><p class="muted">${esc(msg)}</p></div>`;
const card = (icon, title, msg) => `<div class="card center"><div class="icon">${icon}</div><h2>${esc(title)}</h2><p>${msg}</p>${closeBtn()}</div>`;
const closeBtn = () => liff.isInClient() ? `<button onclick="liff.closeWindow()">關閉</button>` : '';

async function api(action, data = {}) {
  const body = { action, ...data };
  if (action !== 'event') body.idToken = liff.getIDToken();
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'TOKEN_EXPIRED') { liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('登入逾時，重新登入中…'); }
    throw new Error(j.error);
  }
  return j;
}

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const eventId = new URLSearchParams(location.search).get('event');
    if (eventId) await memberFlow(eventId);
    else await publisherFlow();
  } catch (e) {
    view(card('⚠️', '發生錯誤', esc(e.message)));
  }
}

/* ================= 成員：一鍵報名 ================= */
async function memberFlow(eventId) {
  view(loading('報名中…'));
  showResult(await api('register', { eventId }), eventId);
}

function showResult(r, eventId) {
  const t = esc(r.event ? r.event.title : '');
  switch (r.status) {
    case 'registered': view(card('✅', '報名成功', `${esc(r.name)}，你已完成「${t}」的報名`)); break;
    case 'already':    view(card('👌', '你已經報名過了', `${esc(r.name)}，「${t}」已有你的報名紀錄`)); break;
    case 'closed':     view(card('⏰', '報名已截止', `「${t}」目前不開放報名`)); break;
    case 'need_bind':  bindForm(eventId, r.event); break;
    case 'not_found':  bindForm(eventId, r.event, '名單中找不到符合的資料，請確認姓名與手機，或聯絡主辦人。'); break;
    case 'bound_other':view(card('⚠️', '這筆資料已綁定其他 LINE 帳號', '請聯絡主辦人協助處理。')); break;
    default:           view(card('⚠️', '發生錯誤', '未知的回應'));
  }
}

function bindForm(eventId, ev, warn = '') {
  view(`<div class="card">
    <h2>第一次報名，請確認身分</h2>
    ${ev ? `<p>活動：<b>${esc(ev.title)}</b></p>` : ''}
    <p class="muted">只需要填這一次，之後按圖卡就會直接報名。</p>
    ${warn ? `<p class="warn">${esc(warn)}</p>` : ''}
    <label>姓名<input id="f-name" autocomplete="name"></label>
    <label>手機<input id="f-phone" type="tel" inputmode="numeric" placeholder="0912345678"></label>
    <button id="f-go" class="primary">確認並報名</button>
  </div>`);
  const btn = document.getElementById('f-go');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '確認中…';
    try {
      const r = await api('bind', { eventId, name: document.getElementById('f-name').value, phone: document.getElementById('f-phone').value });
      showResult(r, eventId);
    } catch (e) {
      alert(e.message); btn.disabled = false; btn.textContent = '確認並報名';
    }
  };
}

/* ================= 發布者平台 ================= */
let ME = null;

async function publisherFlow() {
  view(loading('載入發布平台…'));
  ME = await api('me');
  if (!ME.isPublisher) {
    view(`<div class="card center"><div class="icon">🔒</div><h2>你還沒有發布權限</h2>
      <p class="muted">把下面這串代碼交給管理員，貼到試算表「發布者」工作表的第一欄即可。</p>
      <code id="uid">${esc(ME.userId)}</code>
      <button onclick="navigator.clipboard.writeText('${esc(ME.userId)}').then(()=>alert('已複製'))">複製代碼</button></div>`);
    return;
  }
  renderPublisher();
}

function renderPublisher() {
  view(`<div class="card">
      <h1>發布報名圖卡</h1>
      <p class="muted">${esc(ME.displayName)}，填好內容後按下發送，選擇要發到的群組即可。</p>
      <label>活動名稱 *<input id="e-title" maxlength="60"></label>
      <label>日期時間<input id="e-date" placeholder="例：11/20（五）19:00"></label>
      <label>地點<input id="e-place"></label>
      <label>說明<textarea id="e-desc" maxlength="300"></textarea></label>
      <label>圖片網址（選填，須為 https 開頭）<input id="e-image" type="url" placeholder="https://..."></label>
      <label>按鈕文字<input id="e-button" value="我要報名" maxlength="20"></label>
      <p class="muted" style="margin-top:14px">圖卡預覽</p>
      <div id="pv"></div>
      <button id="e-send" class="primary">建立並發送到群組</button>
    </div>
    <div class="card"><h2>已發布的活動</h2><div id="list"><p class="muted">載入中…</p></div></div>`);

  ['title','date','place','desc','image','button'].forEach(k => document.getElementById('e-' + k).addEventListener('input', updatePreview));
  updatePreview();
  document.getElementById('e-send').onclick = createAndSend;
  loadList();
}

function formEvent() {
  const v = k => document.getElementById('e-' + k).value.trim();
  return { title: v('title'), date: v('date'), place: v('place'), desc: v('desc'), image: v('image'), button: v('button') || '我要報名' };
}

function updatePreview() {
  const ev = formEvent();
  document.getElementById('pv').innerHTML = `<div class="preview">
    ${/^https:\/\//.test(ev.image) ? `<img src="${esc(ev.image)}" onerror="this.style.display='none'">` : ''}
    <div class="pv-body"><div class="pv-title">${esc(ev.title || '活動名稱')}</div>
      ${ev.date ? `<div class="pv-meta">時間　${esc(ev.date)}</div>` : ''}
      ${ev.place ? `<div class="pv-meta">地點　${esc(ev.place)}</div>` : ''}
      ${ev.desc ? `<div class="pv-meta">${esc(ev.desc)}</div>` : ''}</div>
    <div class="pv-btn">${esc(ev.button)}</div></div>`;
}

async function createAndSend() {
  const ev = formEvent();
  if (!ev.title) return alert('請填寫活動名稱');
  const btn = document.getElementById('e-send');
  btn.disabled = true; btn.textContent = '建立中…';
  try {
    const { event } = await api('createEvent', { event: ev });
    btn.textContent = '選擇群組…';
    try {
      const sent = await shareEvent(event);
      alert(sent ? '已發送！' : '活動已建立，你取消了發送，可從下方列表再次發送。');
    } catch (e) {
      alert('活動已建立，但無法開啟分享：' + e.message + '\n請從下方列表按「發送到群組」。');
    }
    renderPublisher();
  } catch (e) {
    alert(e.message); btn.disabled = false; btn.textContent = '建立並發送到群組';
  }
}

async function loadList() {
  const box = document.getElementById('list');
  try {
    const { events } = await api('listEvents');
    window._events = events;
    box.innerHTML = events.length ? events.map((e, i) => `<div class="ev">
        <b>${esc(e.title)}</b><span class="badge ${e.open ? '' : 'off'}">${e.open ? '開放中' : '已截止'}</span>
        <div class="muted">${esc(e.date)}　已報名 ${e.count} 人</div>
        <div class="row">
          <button onclick="resend(${i})">發送到群組</button>
          <button onclick="toggleOpen(${i})">${e.open ? '截止報名' : '重新開放'}</button>
        </div></div>`).join('') : '<p class="muted">還沒有活動</p>';
  } catch (e) {
    box.innerHTML = `<p class="warn">${esc(e.message)}</p>`;
  }
}

async function resend(i) {
  try { if (await shareEvent(window._events[i])) alert('已發送！'); }
  catch (e) { alert(e.message); }
}

async function toggleOpen(i) {
  const e = window._events[i];
  try { await api('setOpen', { eventId: e.id, open: !e.open }); loadList(); }
  catch (err) { alert(err.message); }
}

/* ================= 圖卡（Flex Message） ================= */
async function shareEvent(ev) {
  if (!liff.isApiAvailable('shareTargetPicker')) throw new Error('目前環境不支援分享。請確認 LIFF 設定已開啟 shareTargetPicker。');
  const res = await liff.shareTargetPicker([buildFlex(ev)], { isMultiple: true });
  return !!res;
}

function buildFlex(ev) {
  const url = `https://liff.line.me/${LIFF_ID}?event=${encodeURIComponent(ev.id)}`;
  const info = (k, v) => ({ type: 'box', layout: 'baseline', spacing: 'sm', contents: [
    { type: 'text', text: k, color: '#aaaaaa', size: 'sm', flex: 1 },
    { type: 'text', text: String(v), wrap: true, color: '#666666', size: 'sm', flex: 4 } ] });

  const body = [{ type: 'text', text: ev.title, weight: 'bold', size: 'xl', wrap: true }];
  const meta = [];
  if (ev.date) meta.push(info('時間', ev.date));
  if (ev.place) meta.push(info('地點', ev.place));
  if (meta.length) body.push({ type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: meta });
  if (ev.desc) body.push({ type: 'text', text: ev.desc, size: 'sm', color: '#666666', wrap: true, margin: 'lg' });

  const bubble = {
    type: 'bubble',
    body: { type: 'box', layout: 'vertical', contents: body },
    footer: { type: 'box', layout: 'vertical', contents: [
      { type: 'button', style: 'primary', color: '#06C755', height: 'sm',
        action: { type: 'uri', label: (ev.button || '我要報名').slice(0, 20), uri: url } } ] },
  };
  if (/^https:\/\//.test(ev.image || '')) {
    bubble.hero = { type: 'image', url: ev.image, size: 'full', aspectRatio: '20:13', aspectMode: 'cover', action: { type: 'uri', uri: url } };
  }
  return { type: 'flex', altText: `【報名】${ev.title}`.slice(0, 400), contents: bubble };
}

main();
</script>
</body>
</html>
