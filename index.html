  return e.state === 'ended';
}

function renderSent() {
  const panel = $('panel');
  if (!EVENTS.length) {
    SELECTING = false; SELECTED.clear();
    panel.innerHTML = `<div class="empty"><p>還沒有發布過活動。</p><button class="btn send" id="go-new">建立第一個活動</button></div>`;
    $('go-new').onclick = () => { TAB = 'new'; render(); };
    return;
  }
  [...SELECTED].forEach(id => { if (!EVENTS.some(e => e.id === id)) SELECTED.delete(id); });
  const allOn = SELECTED.size === EVENTS.length;
  const past = EVENTS.filter(isPast);
  const due = EVENTS.filter(e => dueReminders(e).length);
  panel.innerHTML = `
    ${!SELECTING && due.length ? `<div class="cleanup due">
      <p><b>⏰ ${due.length} 個活動該發提醒了</b><br><span>${due.map(e => esc(e.title)).join('、')}</span></p>
      <button class="btn plain small" id="go-due">去發提醒</button>
    </div>` : ''}
    ${!SELECTING && past.length ? `<div class="cleanup">
      <p><b>有 ${past.length} 個活動已經結束</b><br><span>可以刪除清理。刪除後內容會保留成範本，之後還能一鍵套用。</span></p>
      <button class="btn plain small" id="sel-past">選取已結束的活動</button>
    </div>` : ''}
    <div class="list-head">
      <span>${SELECTING ? `已選 ${SELECTED.size} 個` : `${EVENTS.length} 個活動`}</span>
      <span class="list-acts">
        ${SELECTING ? `<button class="btn plain small" id="sel-all">${allOn ? '全部取消' : '全選'}</button>` : ''}
        <button class="btn plain small" id="sel-toggle">${SELECTING ? '完成' : '選取'}</button>
      </span>
    </div>
    <div class="stubs ${SELECTING ? 'selecting' : ''}">${EVENTS.map(e => `
    <button class="stub-card ${isPast(e) ? 'past' : ''}" data-open="${esc(e.id)}" ${SELECTING ? `role="checkbox" aria-checked="${SELECTED.has(e.id)}"` : ''} style="border-left: 6px solid ${themeOf(e).btn}">
      <div class="info">${SELECTING ? '<span class="check" aria-hidden="true"></span>' : ''}
        <div class="t">${esc(e.title)}</div>
        <div class="d">${esc(e.date || '未填時間')}${ME.isAdmin && e.creator ? `　由 ${esc(e.creator)} 建立` : ''}</div>
        ${isPast(e) ? '<span class="state over">活動已結束</span>' : stateTag(e.state)}${dueReminders(e).length ? ' <span class="state remind">該發提醒</span>' : ''}
      </div>
      <div class="count"><b>${e.count}</b><small>${e.capacity ? `／${e.capacity} 人` : '人登記'}</small></div>
    </button>`).join('')}</div>`;
  panel.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    if (!SELECTING) return go({ view: 'detail', id: b.dataset.open });
    const id = b.dataset.open;
    SELECTED.has(id) ? SELECTED.delete(id) : SELECTED.add(id);
    renderSent();
  });
  $('sel-toggle').onclick = () => { SELECTING = !SELECTING; SELECTED.clear(); renderSent(); };
  if ($('go-due')) $('go-due').onclick = () => go({ view: 'detail', id: due[0].id });
  if ($('sel-past')) $('sel-past').onclick = () => { SELECTING = true; SELECTED.clear(); past.forEach(e => SELECTED.add(e.id)); renderSent(); };
  if ($('sel-all')) $('sel-all').onclick = () => { if (allOn) SELECTED.clear(); else EVENTS.forEach(e => SELECTED.add(e.id)); renderSent(); };

  // 底部的批次刪除按鈕
  const old = $('bulk-dock'); if (old) old.remove();
  if (!SELECTING) return;
  const dock = document.createElement('div');
  dock.className = 'dock'; dock.id = 'bulk-dock';
  dock.innerHTML = `<div class="inner"><button class="btn danger-fill" id="bulk-del" ${SELECTED.size ? '' : 'disabled'}>刪除所選活動（${SELECTED.size}）</button></div>`;
  $app.appendChild(dock);
  const del = $('bulk-del');
  del.onclick = async () => {
    const ids = [...SELECTED];
    const regs = EVENTS.filter(e => SELECTED.has(e.id)).reduce((n, e) => n + (e.count || 0), 0);
    if (!del.classList.contains('armed')) {
      del.classList.add('armed');
      del.textContent = `確定刪除 ${ids.length} 個活動？${regs ? `${regs} 筆登記也會刪除，` : ''}再按一次`;
      setTimeout(() => { if (del.isConnected && !del.disabled) { del.classList.remove('armed'); del.textContent = `刪除所選活動（${SELECTED.size}）`; } }, 4000);
      return;
    }
    del.disabled = true; del.textContent = '刪除中';
    try {
      const r = await api('deleteEvents', { eventIds: ids });
      toast(`已刪除 ${r.events} 個活動${r.logs ? `、${r.logs} 筆登記` : ''}，內容已保留成範本`);
      SELECTING = false; SELECTED.clear();
      await refreshEvents();
      render();
    } catch (e) { toast(e.message); del.disabled = false; del.classList.remove('armed'); del.textContent = `刪除所選活動（${SELECTED.size}）`; }
  };
}

/* ---------- 活動詳情 ---------- */
async function renderDetail(id) {
  view(`<div class="subbar"><button class="back" id="back">‹ 已發布</button></div>${loading()}`);
  $('back').onclick = () => { TAB = 'sent'; go({ view: 'tabs' }); };
  let d;
  try { d = await api('eventDetail', { eventId: id }); }
  catch (e) { toast(e.message); return; }
  const ev = d.event, list = d.attendees;
  const i = EVENTS.findIndex(x => x.id === ev.id); if (i >= 0) EVENTS[i] = ev;

  view(`
    <div class="subbar"><button class="back" id="back">‹ 已發布</button><button class="btn plain small" id="edit">編輯</button></div>
    ${ticket(ev, `<div class="stub tally"><b>${ev.count}</b><span>${ev.capacity ? `／${ev.capacity} 人` : '人登記'}</span>${stateTag(ev.state)}</div>`)}
    <div class="btn-row">
      <button class="btn send" id="share">發送到群組</button>
      <button class="btn plain" id="toggle">${ev.open ? '停止登記' : '重新開放'}</button>
    </div>
    ${remindBoxHtml(ev)}
    ${statsHtml(ev, list)}
    <div class="roll-head"><h2>登記名單</h2>${list.length ? `<button class="btn plain small" id="copy">複製名單</button>` : ''}</div>
    ${list.length ? `<ol class="roll">${list.map(a => `
        <li><span class="nm">${esc(a.name)}${answerText(ev, a) ? `<small class="ans">${esc(answerText(ev, a))}</small>` : ''}${a.lineName && a.lineName !== a.name ? `<small>LINE：${esc(a.lineName)}</small>` : ''}</span><time>${esc(a.time)}</time></li>`).join('')}</ol>`
      : `<div class="empty">還沒有人登記。把圖卡發到群組，大家就能一鍵登記。</div>`}
    <button class="btn cancel" style="margin-top:28px" id="del">刪除活動</button>`);

  $('back').onclick = () => { TAB = 'sent'; go({ view: 'tabs' }); };
  $('edit').onclick = () => go({ view: 'edit', id: ev.id });
  $('share').onclick = () => share(ev);
  if ($('remind-send')) $('remind-send').onclick = () => sendReminder(ev);
  document.querySelectorAll('[data-statcopy]').forEach(b => b.onclick = () => copyText(STAT_COPY[+b.dataset.statcopy], '已複製分組名單'));
  $('del').onclick = async () => {
    const b = $('del');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = list.length ? `確定刪除？${list.length} 筆登記也會一起刪除` : '確定刪除這個活動？';
      setTimeout(() => { if (b.isConnected && !b.disabled) { b.classList.remove('armed'); b.textContent = '刪除活動'; } }, 4000);
      return;
    }
    b.disabled = true; b.textContent = '刪除中';
    try {
      await api('deleteEvent', { eventId: ev.id });
      toast(`已刪除「${ev.title}」，內容已保留成範本，之後可在「新活動」一鍵套用。`);
      await refreshEvents();
      TAB = 'sent'; go({ view: 'tabs' });
    } catch (e) { toast(e.message); b.disabled = false; b.classList.remove('armed'); b.textContent = '刪除活動'; }
  };
  $('toggle').onclick = async () => {
    $('toggle').disabled = true;
    try { await api('setOpen', { eventId: ev.id, open: !ev.open }); toast(ev.open ? '已停止登記' : '已重新開放登記'); renderDetail(ev.id); }
    catch (e) { toast(e.message); $('toggle').disabled = false; }
  };
  if (list.length) $('copy').onclick = () => copyText(
    `${ev.title}\n登記 ${list.length} 人${ev.capacity ? `／上限 ${ev.capacity}` : ''}\n` + list.map((a, n) => `${n + 1}. ${[a.name].concat((a.answers || []).filter(Boolean)).join('，')}`).join('\n'),
    '已複製名單');
}

/** 活動詳情裡的提醒區：列出每個時段的狀態，到了時間按鈕會變醒目 */
function remindBoxHtml(ev) {
  const s = startDate(ev);
  if (!s || s <= new Date()) return '';
  const due = dueReminders(ev);
  const lines = (ev.remind || []).map(h => {
    const at = new Date(s - h * 3600000);
    const st = (ev.reminded || []).includes(h) ? '✓ 已發' : due.includes(h) ? '<b style="color:var(--stamp)">該發了</b>' : `${at.getMonth() + 1}/${at.getDate()} ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')} 通知你`;
    return `<li><b>${remindName(h)}</b>　${st}</li>`;
  }).join('');
  return `<section class="remind-box ${due.length ? 'due' : ''}">
    <h3>⏰ 活動提醒　<small style="font-weight:400;color:var(--ink-2)">${esc(untilText(ev))}</small></h3>
    ${lines ? `<ul>${lines}</ul>` : `<ul><li>沒有設定提醒時段，可以按「編輯」加上。</li></ul>`}
    <button class="btn ${due.length ? 'send' : 'plain'}" id="remind-send">發提醒到群組</button>
  </section>`;
}

async function sendReminder(ev) {
  const b = $('remind-send');
  b.disabled = true;
  if (DEMO) { toast('預覽模式：正式版會在這裡跳出群組選單'); b.disabled = false; return; }
  if (!liff.isLoggedIn()) { toast('發送到群組前需要登入 LINE 一次'); setTimeout(() => liff.login({ redirectUri: location.href }), 600); return; }
  if (!liff.isApiAvailable('shareTargetPicker')) { toast('無法開啟群組選單'); b.disabled = false; return; }
  try {
    const res = await liff.shareTargetPicker([buildRemindFlex(ev)], { isMultiple: true });
    if (!res) { toast('已取消發送'); b.disabled = false; return; }
    const offsets = dueReminders(ev);
    if (offsets.length) await api('markReminded', { eventId: ev.id, offsets });
    toast('已把提醒發到群組');
    await refreshEvents();
    renderDetail(ev.id);
  } catch (e) { toast('發送失敗：' + e.message); b.disabled = false; }
}

let STAT_COPY = [];
/** 依每個問題整理回答：全是數字就加總，其他相同答案歸在一起 */
function statsHtml(ev, list) {
  const qs = ev.questions || [];
  if (!list.length) return '';
  const num = v => { const m = /^\s*(\d+(?:\.\d+)?)\s*(人|位|個|份)?\s*$/.exec(v); return m ? +m[1] : null; };

  // 登記趨勢：每天幾人登記（最近 14 天有登記的日子）
  const days = new Map();
  list.forEach(a => { const d = String(a.time).split(' ')[0]; days.set(d, (days.get(d) || 0) + 1); });
  const dayList = [...days].slice(-14);
  const peak = Math.max(...dayList.map(d => d[1]));
  const trend = `<div class="stat"><h3>登記趨勢</h3><p class="meta">共 ${list.length} 人，每天登記人數</p>
    <div class="chart" role="img" aria-label="${dayList.map(([d, n]) => `${d} ${n} 人`).join('，')}">
      ${dayList.map(([d, n]) => `<div class="col"><div class="track"><span class="n">${n}</span><i style="height:${Math.max(6, n / peak * 100)}%"></i></div><span class="d">${esc(d)}</span></div>`).join('')}
    </div></div>`;

  // 「北區」「北區 」「ＮＯＲＴＨ」視為同一個答案
  const keyOf = v => v.replace(/\s+/g, '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).toLowerCase();
  const isCountQuestion = q => /人數|幾位|幾人|幾個|多少|數量|份數/.test(q);
  STAT_COPY = [];

  const cards = qs.map((qObj, i) => {
    const q = qText(qObj), opts = qOpts(qObj);
    const all = list.map(a => ({ name: a.name, v: String((a.answers || [])[i] || '').trim() }));
    const filled = all.filter(x => x.v), blank = all.filter(x => !x.v);
    const head = (copy) => `<div class="stat-head"><div><h3>${esc(q)}</h3><p class="meta">已回答 ${filled.length}／${list.length} 人</p></div>${copy}</div>`;
    if (!filled.length) return `<div class="stat">${head('')}<p class="meta">還沒有人回答。</p></div>`;

    // 問人數的題目，而且回答都是數字：顯示合計
    if (isCountQuestion(q) && filled.every(x => num(x.v) !== null)) {
      const sum = filled.reduce((s, x) => s + num(x.v), 0);
      return `<div class="stat">${head('')}<p class="sum"><b>${+sum.toFixed(2)}</b><span>合計</span></p></div>`;
    }

    // 其他題目：依答案分組，每組下面列出名字
    const groups = new Map();
    filled.forEach(x => { const k = keyOf(x.v); if (!groups.has(k)) groups.set(k, { label: x.v, names: [] }); groups.get(k).names.push(x.name); });
    let sorted;
    if (opts.length) {
      // 下拉選單：照選項順序，沒人選的也列出來
      sorted = opts.map(o => groups.get(keyOf(o)) || { label: o, names: [] });
      groups.forEach((g, k) => { if (!opts.some(o => keyOf(o) === k)) sorted.push(g); });
      // 選項很多（例如 41 個大區）時，只列有人選的，其餘合成一行
      if (opts.length > 8) {
        const empty = sorted.filter(g => !g.names.length).length;
        sorted = sorted.filter(g => g.names.length);
        if (empty) sorted.emptyNote = `其餘 ${empty} 個選項 0 人`;
      }
    } else {
      sorted = [...groups.values()].sort((a, b) => b.names.length - a.names.length || a.label.localeCompare(b.label, 'zh-Hant'));
    }
    if (blank.length) { const note = sorted.emptyNote; sorted.push({ label: '未回答', names: blank.map(x => x.name), none: true }); sorted.emptyNote = note; }
    const top = Math.max(1, ...sorted.map(g => g.names.length));

    STAT_COPY[i] = `${ev.title}｜${q}\n` + sorted.filter(g => g.names.length).map(g => `【${g.label}】${g.names.length} 人\n${g.names.join('、')}`).join('\n');
    const blocks = sorted.map(g => `
      <section class="group-block ${g.none ? 'none' : ''}">
        <div class="top"><span class="lbl">${esc(g.label)}</span><span class="cnt">${g.names.length} 人</span></div>
        <div class="bar"><i style="width:${g.names.length / top * 100}%"></i></div>
        ${g.names.length ? `<ol class="names">${g.names.map(n => `<li>${esc(n)}</li>`).join('')}</ol>` : ''}
      </section>`).join('');
    const note = sorted.emptyNote ? `<p class="meta empty-note">${sorted.emptyNote}</p>` : '';
    return `<div class="stat">${head(`<button class="btn plain small" data-statcopy="${i}">複製</button>`)}${blocks}${note}</div>`;
  }).join('');
  return `<div class="roll-head"><h2>統計</h2></div><div class="stats">${trend}${cards}</div>`;
}

/** 名單上回答的顯示：「我可以預備：三杯雞｜同行人數：3」 */
function answerText(ev, a) {
  return (ev.questions || []).map((q, i) => (a.answers || [])[i] ? `${qText(q).replace(/[？?]\s*$/, '')}：${a.answers[i]}` : '').filter(Boolean).join('｜');
}

/* ---------- 編輯活動 ---------- */
function renderEdit(id) {
  const ev = EVENTS.find(x => x.id === id);
  if (!ev) return go({ view: 'tabs' });
  editDraft = {
    title: ev.title, date: ev.date, place: ev.place, desc: ev.desc, image: ev.image, button: ev.button,
    start: (ev.start || '').replace(' ', 'T'), end: (ev.end || '').replace(' ', 'T'),
    capacity: ev.capacity ? String(ev.capacity) : '', deadline: (ev.deadline || '').replace(' ', 'T'),
    questions: (ev.questions || []).map(toDraftQuestion),
    theme: ev.theme || 'classic',
    remind: ev.remind || [],
  };
  view(`
    <div class="subbar"><button class="back" id="back">‹ 取消</button><h1>編輯活動</h1><span></span></div>
    ${eventForm(editDraft)}
    <div class="dock"><div class="inner"><button class="btn ink" id="save">儲存變更</button></div></div>`);
  bindEventForm(editDraft);
  $('back').onclick = () => go({ view: 'detail', id });
  $('save').onclick = async () => {
    if (!editDraft.title.trim()) { toast('請先填活動名稱'); return; }
    if (questionProblem(editDraft)) { toast(questionProblem(editDraft)); return; }
    const b = $('save'); b.disabled = true; b.textContent = '儲存中';
    try {
      await api('updateEvent', { eventId: id, event: toPayload(editDraft) });
      toast('已儲存變更。群組裡舊的圖卡不會變，需要的話再發送一次。');
      await refreshEvents();
      go({ view: 'detail', id });
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = '儲存變更'; }
  };
}

/* ---------- 成員名單 ---------- */
let memberQuery = '';
async function renderMembers() {
  const panel = $('panel');
  if (!MEMBERS) {
    panel.innerHTML = loading();
    try { MEMBERS = (await api('listMembers')).members; } catch (e) { panel.innerHTML = `<p class="warn">${esc(e.message)}</p>`; return; }
    if (TAB !== 'members' || ROUTE.view !== 'tabs') return;
    return render();
  }
  const boundN = MEMBERS.filter(m => m.bound).length;
  panel.innerHTML = `
    <form class="add-member" id="add">
      <h2>新增成員</h2>
      <div class="row2">
        <label class="field"><span>姓名</span><input id="m-name" autocomplete="off"></label>
        <label class="field"><span>手機</span><input id="m-phone" type="tel" inputmode="numeric" placeholder="0912345678"></label>
      </div>
      <button class="btn ink" type="submit">加入名單</button>
    </form>
    <p class="summary">共 ${MEMBERS.length} 人，${boundN} 人已綁定 LINE。第一次登記的人會自動加入名單。</p>
    <input class="search" id="q" type="search" placeholder="搜尋姓名或手機" value="${esc(memberQuery)}">
    <ul class="members" id="mlist"></ul>`;

  $('add').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;
    try {
      MEMBERS = (await api('addMember', { name: $('m-name').value.trim(), phone: $('m-phone').value })).members;
      toast('已加入名單'); memberQuery = ''; render();
    } catch (err) { toast(err.message); btn.disabled = false; }
  };
  $('q').oninput = e => { memberQuery = e.target.value; drawMembers(); };
  drawMembers();
}

function drawMembers() {
  const q = memberQuery.trim();
  const list = MEMBERS.filter(m => !q || m.name.includes(q) || m.phone.includes(q));
  const ul = $('mlist');
  if (!list.length) { ul.innerHTML = `<li class="empty">${q ? '找不到符合的成員。' : '名單還是空的，先在上面加入成員。'}</li>`; return; }
  ul.innerHTML = list.map(m => `
    <li>
      <div class="line1"><span class="nm">${esc(m.name)}</span><span class="ph">${esc(m.phone)}</span></div>
      <div class="line2">
        <span>${m.bound ? `<span class="bound">已綁定</span>${m.lineName ? `　LINE：${esc(m.lineName)}` : ''}` : '尚未綁定 LINE'}</span>
        <span class="acts">
          ${m.bound ? `<button data-unbind="${m.row}">解除綁定</button>` : ''}
          <button class="danger" data-remove="${m.row}">移除</button>
        </span>
      </div>
    </li>`).join('');
  const byRow = row => MEMBERS.find(m => m.row === +row);
  ul.querySelectorAll('[data-unbind]').forEach(b => b.onclick = () => armThen(b, '確定解除？', async () => {
    const m = byRow(b.dataset.unbind);
    MEMBERS = (await api('unbindMember', { row: m.row, name: m.name })).members;
    toast(`已解除 ${m.name} 的綁定，他下次登記要重新填姓名和手機`); render();
  }));
  ul.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => armThen(b, '確定移除？', async () => {
    const m = byRow(b.dataset.remove);
    MEMBERS = (await api('removeMember', { row: m.row, name: m.name })).members;
    toast(`已把 ${m.name} 移出名單`); render();
  }));
}

/** 第一次點按鈕先變成確認狀態，3 秒內再點一次才執行 */
function armThen(btn, label, fn) {
  if (!btn.classList.contains('armed')) {
    const old = btn.textContent;
    btn.classList.add('armed'); btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = old; } }, 3000);
    return;
  }
  btn.disabled = true;
  fn().catch(e => { toast(e.message); MEMBERS = null; render(); });
}

/* ================= 使用教學 =================
   第一次打開平台：完整教學。localStorage 記住看過的教學版本。
   之後加功能時：新步驟標上 since: 新版本號，並把 TOUR_VERSION 加 1。
   看過舊版的人不會重看整套，而是跳出「新功能：○○　看介紹」，只介紹新加的步驟。 */
const TOUR_KEY = 'signup.tour';
const TOUR_VERSION = 8; // 2：加入圖卡色調　3：我的個人資料　4：安裝到手機桌面　5：從過去的活動套用　6：批次刪除　7：已結束提醒與範本保留　8：活動前提醒
const q1 = sel => document.querySelector(sel);
const groupOf = sel => { const el = q1(sel); return el && (el.closest('.group') || el.closest('.field')); };
const TOUR_STEPS = [
  { since: 5, tab: 'new', target: () => q1('.templates'), title: '從過去的活動套用',
    text: '常辦的活動不用重打：點一下過去建立的活動，名稱、地點、說明、問題和色調都會帶入，再填新的時間就好。' },
  { since: 1, tab: 'new', target: () => q1('.pv-panel'), title: '圖卡預覽',
    text: '群組裡的人看到的就是這張圖卡。下面每填一個欄位，預覽會立刻跟著更新。' },
  { since: 2, tab: 'new', target: () => q1('.tone-pick'), title: '圖卡色調',
    text: '在預覽圖下面，依活動性質挑一種色調：愛筵聚餐、禱告、福音開展、青年、兒童……也可以按「隨機換一個」。群組裡的圖卡和接龍名單都會換成這個顏色。' },
  { since: 1, tab: 'new', target: () => groupOf('[data-k=title]'), title: '活動名稱與時間',
    text: '填活動名稱；開始和結束時間用選的，只有開始時間也可以。地點照實寫。' },
  { since: 1, tab: 'new', target: () => groupOf('[data-k=capacity]'), title: '名額與登記截止',
    text: '都可以留白。額滿或過了截止時間，登記會自動停止。' },
  { since: 8, tab: 'new', target: () => q1('.remind-pick'), title: '活動前提醒',
    text: '勾選要在活動前 7 天、24 小時或 1 小時提醒。到了時間會寄 Email 通知你（不用開著平台），點信裡的按鈕、選群組，提醒卡就發出去了。' },
  { since: 1, tab: 'new', target: () => groupOf('.img-pick'), title: '活動圖片',
    text: '按「上傳圖片」直接從手機選照片，會自動縮小後存好；也可以貼圖片網址。' },
  { since: 1, tab: 'new', target: () => q1('#q-chips') && q1('#q-chips').closest('.group'), title: '登記時要問的問題',
    text: '點「所屬大區」「所屬會所」「我可以預備？」等常用問題；或按「新增問題」自己寫，每題可選自由填寫或下拉選單。回答會跟名字一起出現在接龍名單。' },
  { since: 1, tab: 'new', target: () => q1('#send'), title: '發送到 LINE 群組',
    text: '填好後按這裡，從 LINE 的選單勾選群組或朋友，可以一次發給好幾個。' },
  { since: 1, tab: 'new', target: () => q1('[data-tab=sent]'), title: '已發布的活動',
    text: '發出去的活動都在這裡，你只會看到自己建立的。' },
  { since: 7, tab: 'sent', target: () => q1('.cleanup') || q1('.stub-card.past'), title: '已結束的活動',
    text: '活動時間過了會變成灰色。上面會提醒有幾個已結束，按「選取已結束的活動」就能一次刪除。刪除後內容會保留成範本，在「新活動」照樣可以一鍵套用。' },
  { since: 6, tab: 'sent', target: () => q1('#sel-toggle'), title: '批次刪除活動',
    text: '按「選取」後點活動來勾選，也可以「全選」，再按底部的「刪除所選活動」一次刪掉。刪除要按兩次確認，無法復原。' },
  { since: 1, tab: 'sent', target: () => q1('.stub-card') || q1('#panel .empty'), title: '活動詳情與統計',
    text: '點進活動可以看登記名單、依大區或會所分組的統計、複製名單，也能編輯、停止登記或刪除活動。' },
  { since: 1, admin: true, tab: 'new', target: () => q1('[data-tab=members]'), title: '成員名單',
    text: '只有管理員看得到。所有報過名的人的姓名、手機都在這裡，可以搜尋、解除綁定或移除。' },
  { since: 4, tab: 'new', target: () => q1('#install-link'), title: '安裝到手機桌面',
    text: '點這裡可以把平台裝到手機桌面，以後像 App 一樣一點就開，不用再找連結。' },
  { since: 3, tab: 'new', target: () => q1('.page-foot .mydata-link:last-child'), title: '我的個人資料',
    text: '每個人都能在這裡查看系統存了自己哪些資料，也可以自己刪除。登記結果頁的最下方也有這個連結。' },
  { since: 1, tab: 'new', target: () => q1('#help'), title: '隨時重看教學',
    text: '登記的人也能自己修改回答、取消登記、轉傳活動給朋友。忘記怎麼用時，按這個「?」再看一次。' },
];

const tourSeen = () => { try { const v = localStorage.getItem(TOUR_KEY); return v == null ? 0 : parseInt(v, 10) || 0; } catch (e) { return TOUR_VERSION; } };
const markTour = () => { try { localStorage.setItem(TOUR_KEY, String(TOUR_VERSION)); } catch (e) {} };

function maybeStartTour() {
  const seen = tourSeen();
  if (!seen) return startTour(TOUR_STEPS);
  if (seen >= TOUR_VERSION) return;
  markTour();
  const fresh = TOUR_STEPS.filter(s => s.since > seen && (!s.admin || ME.isAdmin));
  if (fresh.length) notice(`新功能：${fresh.map(s => s.title).join('、')}`, '看介紹', () => startTour(fresh));
}

function notice(text, action, fn) {
  const n = $('notice');
  $('notice-text').textContent = text; $('notice-go').textContent = action; n.hidden = false;
  const close = () => { n.hidden = true; };
  $('notice-go').onclick = () => { close(); fn(); };
  $('notice-x').onclick = close;
  setTimeout(close, 15000);
}

let TOUR = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function startTour(steps) {
  if (TOUR) return;
  markTour();
  steps = steps.filter(s => !s.admin || ME.isAdmin);
  if (!steps.length) return;
  const el = document.createElement('div');
  el.className = 'tour';
  el.innerHTML = `<div class="tour-catch"></div><div class="tour-hole" aria-hidden="true"></div>
    <div class="tour-bubble" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
      <div class="tour-head"><h2 id="tour-title"></h2><span class="tour-count"></span></div>
      <p id="tour-text"></p>
      <div class="tour-btns"><button type="button" class="tour-skip">跳過</button><button type="button" class="tour-prev">上一步</button><button type="button" class="tour-next">下一步</button></div>
    </div>`;
  document.body.append(el);
  TOUR = { el, steps, i: -1, from: TAB };
  el.querySelector('.tour-catch').addEventListener('click', e => e.stopPropagation());
  el.querySelector('.tour-skip').onclick = endTour;
  el.querySelector('.tour-prev').onclick = () => tourGo(TOUR.i - 1, -1);
  el.querySelector('.tour-next').onclick = () => tourGo(TOUR.i + 1, 1);
  addEventListener('keydown', tourKey, true);
  addEventListener('resize', placeTour);
  addEventListener('scroll', placeTour, true);
  requestAnimationFrame(() => el.classList.add('on'));
  tourGo(0, 1);
}

function tourKey(e) { if (TOUR && e.key === 'Escape') { e.preventDefault(); endTour(); } }

async function tourGo(i, dir) {
  const t = TOUR;
  if (!t || t.busy || i < 0) return;
  if (i >= t.steps.length) return endTour();
  const s = t.steps[i];
  t.busy = true;
  if (s.tab && (TAB !== s.tab || ROUTE.view !== 'tabs')) { TAB = s.tab; ROUTE = { view: 'tabs' }; render(); }
  let el = null;
  for (let n = 0; n < 40 && !el; n++) { el = s.target(); if (!el) await sleep(50); }
  t.busy = false;
  if (TOUR !== t) return;
  if (!el) return tourGo(i + dir, dir); // 這一步要圈的東西不在畫面上（例如沒有權限）就跳過
  t.i = i; t.target = el;
  el.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
  t.el.querySelector('#tour-title').textContent = s.title;
  t.el.querySelector('#tour-text').textContent = s.text;
  t.el.querySelector('.tour-count').textContent = `${i + 1} / ${t.steps.length}`;
  t.el.querySelector('.tour-prev').disabled = i === 0;
  t.el.querySelector('.tour-next').textContent = i === t.steps.length - 1 ? '完成' : '下一步';
  placeTour();
  await sleep(reducedMotion() ? 0 : 380); // 等捲動停下來再對準
  placeTour();
  t.el.querySelector('.tour-next').focus({ preventScroll: true });
}

function placeTour() {
  const t = TOUR;
  if (!t || !t.target) return;
  const PAD = 6, GAP = 14, EDGE = 12;
  const r = t.target.getBoundingClientRect();
  const x = Math.max(r.left - PAD, 4), y = Math.max(r.top - PAD, 4);
  const w = Math.min(r.right + PAD, innerWidth - 4) - x, h = Math.min(r.bottom + PAD, innerHeight - 4) - y;
  const hole = t.el.querySelector('.tour-hole');
  hole.style.width = `${Math.max(0, w)}px`; hole.style.height = `${Math.max(0, h)}px`;
  hole.style.transform = `translate(${x}px, ${y}px)`;
  const b = t.el.querySelector('.tour-bubble');
  const bw = b.offsetWidth, bh = b.offsetHeight;
  let by;
  if (innerHeight - (y + h) - GAP - EDGE >= bh) by = y + h + GAP;          // 放在框的下面
  else if (y - GAP - EDGE >= bh) by = y - GAP - bh;                          // 放在框的上面
  else by = innerHeight - EDGE - bh;                                         // 都放不下就貼底
  const bx = Math.min(Math.max(x + w / 2 - bw / 2, EDGE), innerWidth - EDGE - bw);
  b.style.transform = `translate(${bx}px, ${Math.max(EDGE, by)}px)`;
}

function endTour() {
  const t = TOUR;
  if (!t) return;
  TOUR = null;
  removeEventListener('keydown', tourKey, true);
  removeEventListener('resize', placeTour);
  removeEventListener('scroll', placeTour, true);
  t.el.classList.remove('on');
  setTimeout(() => t.el.remove(), 220);
  TAB = t.from === 'members' && !ME.isAdmin ? 'new' : t.from; ROUTE = { view: 'tabs' }; render();
}

/* ================= 發送到群組 ================= */
async function share(ev) {
  if (DEMO) { toast('預覽模式：正式版會在這裡跳出群組選單'); return false; }
  if (!liff.isLoggedIn()) { toast('發送到群組前需要登入 LINE 一次'); setTimeout(() => liff.login({ redirectUri: location.href }), 600); return false; }
  if (!liff.isApiAvailable('shareTargetPicker')) { toast('無法開啟群組選單，請確認 LIFF 已開啟 Share target picker'); return false; }
  try {
    const res = await liff.shareTargetPicker([buildFlex(ev)], { isMultiple: true });
    toast(res ? '已發送到群組' : '已取消發送');
    return !!res;
  } catch (e) {
    toast('發送失敗：' + e.message); return false;
  }
}

/* ================= 群組裡的圖卡（Flex Message） ================= */
const flexInfo = (k, v, t) => ({ type: 'box', layout: 'baseline', spacing: 'md', contents: [
  { type: 'text', text: k, color: t.muted, size: 'sm', flex: 0 },
  { type: 'text', text: String(v), wrap: true, color: t.ink, size: 'sm', flex: 1 } ] });

const flexButton = (label, ev) => { const t = themeOf(ev); return { type: 'box', layout: 'vertical', paddingAll: '16px', paddingBottom: '8px', contents: [
  { type: 'box', layout: 'horizontal', spacing: 'md', contents: [
    { type: 'box', layout: 'vertical', width: '6px', cornerRadius: '3px', backgroundColor: t.notch, contents: [] },
    { type: 'button', style: 'primary', color: t.btn, height: 'sm', flex: 1,
      action: { type: 'uri', label: String(label).slice(0, 20), uri: liffUrl(ev.id) } } ] },
  // LINE 不一定能長按轉傳這類圖卡，所以附一個轉傳連結
  { type: 'button', style: 'link', height: 'sm', color: t.muted, margin: 'sm',
    action: { type: 'uri', label: '轉傳給其他群組或朋友', uri: shareUrl(ev.id) } } ] }; };

function buildFlex(ev) {
  const t = themeOf(ev);
  const body = [{ type: 'text', text: ev.title, weight: 'bold', size: 'xl', wrap: true, color: t.ink }];
  const meta = [];
  if (ev.date) meta.push(flexInfo('時間', ev.date, t));
  if (ev.place) meta.push(flexInfo('地點', ev.place, t));
  if (+ev.capacity) meta.push(flexInfo('名額', ev.capacity + ' 人', t));
  if (shortTime(ev.deadline)) meta.push(flexInfo('截止', shortTime(ev.deadline), t));
  if (meta.length) body.push({ type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: meta });
  if (ev.desc) body.push({ type: 'text', text: ev.desc, size: 'sm', color: t.muted, wrap: true, margin: 'lg' });

  const bubble = {
    type: 'bubble',
    styles: { body: { backgroundColor: t.paper }, footer: { backgroundColor: t.paper } },
    body: { type: 'box', layout: 'vertical', paddingAll: '20px', contents: body },
    footer: flexButton(ev.button || '我要登記', ev),
  };
  if (isHttps(ev.image)) {
    bubble.hero = { type: 'image', url: ev.image, size: 'full', aspectRatio: '20:13', aspectMode: 'cover', action: { type: 'uri', uri: liffUrl(ev.id) } };
  }
  return { type: 'flex', altText: `【登記】${ev.title}`.slice(0, 400), contents: bubble };
}

/** 提醒卡：上方色帶寫「明天 18:00 開始」，下面是時間地點與目前人數 */
function buildRemindFlex(ev) {
  const t = themeOf(ev);
  const when = untilText(ev);
  const meta = [];
  if (ev.date) meta.push(flexInfo('時間', ev.date, t));
  if (ev.place) meta.push(flexInfo('地點', ev.place, t));
  const dl = (ev.deadline || '').replace(' ', 'T');
  if (dl && new Date(dl) > new Date()) meta.push(flexInfo('截止', shortTime(ev.deadline), t));
  const count = `目前 ${ev.count || 0} 人登記${ev.capacity ? `／名額 ${ev.capacity}` : ''}`;
  const open = ev.state === 'open' || !ev.state;
  return {
    type: 'flex',
    altText: `⏰ 提醒：「${ev.title}」${when}`.slice(0, 400),
    contents: {
      type: 'bubble',
      styles: { header: { backgroundColor: t.btn }, body: { backgroundColor: t.paper }, footer: { backgroundColor: t.paper } },
      header: { type: 'box', layout: 'vertical', paddingAll: '16px', contents: [
        { type: 'text', text: '⏰ 活動提醒', size: 'sm', color: t.notch, weight: 'bold' },
        { type: 'text', text: when, size: 'xl', color: '#FFFFFF', weight: 'bold', margin: 'sm', wrap: true } ] },
      body: { type: 'box', layout: 'vertical', paddingAll: '20px', contents: [
        { type: 'text', text: ev.title, weight: 'bold', size: 'lg', wrap: true, color: t.ink },
        ...(meta.length ? [{ type: 'box', layout: 'vertical', margin: 'md', spacing: 'sm', contents: meta }] : []),
        { type: 'text', text: count, size: 'sm', color: t.muted, margin: 'md' } ] },
      footer: open ? flexButton('還沒登記？按這裡', ev)
        : { type: 'box', layout: 'vertical', paddingAll: '16px', contents: [{ type: 'button', style: 'secondary', height: 'sm', action: { type: 'uri', label: '查看名單', uri: liffUrl(ev.id) } }] },
    },
  };
}

/** 接龍卡：列出目前所有登記的人，一人一行、序號用色調粗體，下面附登記按鈕 */
function buildRollFlex(ev, names, who, verb = '登記了') {
  const t = themeOf(ev);
  const n = names.length;
  const MAX = 80; // LINE 圖卡有 30KB 上限，超過的人數另外標示
  const rows = names.slice(0, MAX).map((x, i) => ({ type: 'box', layout: 'baseline', spacing: 'md', contents: [
    { type: 'text', text: `${i + 1}.`, size: 'md', weight: 'bold', color: t.btn, flex: 1, align: 'end' },
    { type: 'text', text: String(x).slice(0, 60), size: 'md', color: t.ink, wrap: true, flex: 8 } ] }));
  if (n > MAX) rows.push({ type: 'text', text: `…還有 ${n - MAX} 人`, size: 'sm', color: t.muted, margin: 'md' });
  // 時間、地點也放在接龍卡上，不用再滑上去找原本的圖卡
  const rollMeta = [];
  if (ev.date) rollMeta.push(flexInfo('時間', ev.date, t));
  if (ev.place) rollMeta.push(flexInfo('地點', ev.place, t));
  if (shortTime(ev.deadline)) rollMeta.push(flexInfo('截止', shortTime(ev.deadline), t));
  const count = `目前 ${n} 人${ev.capacity ? `／名額 ${ev.capacity}` : ''}`;
  return {
    type: 'flex',
    altText: `${who} ${verb}「${ev.title}」，${count}`.slice(0, 400),
    contents: {
      type: 'bubble', size: 'mega',
      styles: { body: { backgroundColor: t.paper }, footer: { backgroundColor: t.paper } },
      body: { type: 'box', layout: 'vertical', paddingAll: '20px', contents: [
        { type: 'text', text: ev.title, weight: 'bold', size: 'lg', wrap: true, color: t.ink },
        ...(rollMeta.length ? [{ type: 'box', layout: 'vertical', margin: 'md', spacing: 'sm', contents: rollMeta }] : []),
        { type: 'text', text: count, size: 'sm', color: t.muted, margin: 'md' },
        { type: 'separator', margin: 'lg', color: t.line },
        { type: 'box', layout: 'vertical', margin: 'lg', spacing: 'md', contents: rows.length ? rows : [{ type: 'text', text: '—', color: t.muted }] },
      ] },
      footer: flexButton('我也要登記', ev),
    },
  };
}

main();
