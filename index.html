<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DDE7EF">
<title>活動報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --sky: #DDE7EF;        /* 頁面底色 */
    --paper: #FFFFFF;      /* 票券紙 */
    --ink: #1C2840;        /* 主要文字 */
    --ink-2: #56627A;      /* 次要文字 */
    --rule: #C9D5E1;       /* 分隔、邊框 */
    --marigold: #F2B632;   /* 票根強調 */
    --line: #06C755;       /* 會送到 LINE 的動作 */
    --line-dark: #049C42;
    --stamp: #C8323C;      /* 印章紅 */
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  #app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  /* ---------- 頂部 ---------- */
  .top { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0 6px; }
  .top h1 { font-family: var(--serif); font-weight: 900; font-size: 26px; letter-spacing: .04em; margin: 0; }
  .top .who { color: var(--ink-2); font-size: 14px; }
  .demo-note { background: var(--marigold); color: var(--ink); font-size: 13px; padding: 8px 12px; border-radius: 8px; margin: 8px 0 4px; }

  .tabs { display: flex; gap: 22px; border-bottom: 2px solid var(--rule); margin: 10px 0 20px; }
  .tabs button { background: none; border: 0; padding: 10px 0; font-size: 16px; font-weight: 500; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
  .tabs .n { font-size: 13px; color: var(--ink-2); margin-left: 4px; }

  /* ---------- 票券（圖卡預覽） ---------- */
  .ticket { position: relative; background: var(--paper); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 0 var(--rule), 0 14px 30px -18px rgba(28,40,64,.45); }
  .ticket .hero { width: 100%; aspect-ratio: 20 / 13; object-fit: cover; display: block; background: var(--rule); }
  .ticket .main { padding: 20px 22px 18px; }
  .ticket .title { font-family: var(--serif); font-weight: 900; font-size: 24px; line-height: 1.35; margin: 0 0 12px; word-break: break-word; }
  .ticket .title.empty { color: var(--rule); }
  .ticket dl { display: grid; grid-template-columns: 3em 1fr; gap: 4px 10px; margin: 0; font-size: 15px; }
  .ticket dt { color: var(--ink-2); }
  .ticket dd { margin: 0; word-break: break-word; }
  .ticket .desc { color: var(--ink-2); font-size: 14px; margin: 12px 0 0; white-space: pre-wrap; word-break: break-word; }
  /* 撕線與兩側缺口 */
  .ticket .perf { position: relative; height: 0; border-top: 2px dashed var(--rule); margin: 0 18px; }
  .ticket .perf::before, .ticket .perf::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--sky); }
  .ticket .perf::before { left: -31px; }
  .ticket .perf::after { right: -31px; }
  .ticket .stub { padding: 16px 22px 20px; display: flex; align-items: center; gap: 14px; }
  .ticket .stub .notch { width: 8px; align-self: stretch; background: var(--marigold); border-radius: 4px; }
  .ticket .stub .fake-btn { flex: 1; background: var(--line); color: #fff; text-align: center; font-weight: 700; padding: 11px; border-radius: 10px; }

  .caption { color: var(--ink-2); font-size: 13px; text-align: center; margin: 10px 0 26px; }

  /* ---------- 表單 ---------- */
  .group { margin: 0 0 22px; }
  .group h2 { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
  .field .help { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---------- 底部固定按鈕 ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--sky) 70%, rgba(221,231,239,0)); }
  .dock .inner { max-width: 480px; margin: 0 auto; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.send { background: var(--line); color: #fff; box-shadow: 0 6px 16px -8px var(--line-dark); }
  .btn.send:active { background: var(--line-dark); }
  .btn.plain { background: var(--paper); color: var(--ink); border: 1.5px solid var(--rule); }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ---------- 已發布列表 ---------- */
  .stubs { display: grid; gap: 12px; }
  .stub-card { background: var(--paper); border-radius: 14px; display: grid; grid-template-columns: 1fr auto; overflow: hidden; }
  .stub-card .info { padding: 14px 16px; min-width: 0; }
  .stub-card .t { font-family: var(--serif); font-weight: 900; font-size: 17px; line-height: 1.4; word-break: break-word; }
  .stub-card .d { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .stub-card .state { display: inline-block; font-size: 12px; margin-top: 6px; padding: 1px 8px; border-radius: 6px; background: #E6F8EE; color: var(--line-dark); }
  .stub-card .state.off { background: #EEF1F5; color: var(--ink-2); }
  .stub-card .count { border-left: 2px dashed var(--rule); padding: 14px 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 84px; }
  .stub-card .count b { font-family: var(--serif); font-size: 30px; line-height: 1; }
  .stub-card .count small { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .stub-card .acts { grid-column: 1 / -1; display: flex; border-top: 1px solid var(--rule); }
  .stub-card .acts button { flex: 1; background: none; border: 0; padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .stub-card .acts button + button { border-left: 1px solid var(--rule); }
  .stub-card .acts .go { color: var(--line-dark); font-weight: 700; }
  .empty { text-align: center; color: var(--ink-2); padding: 40px 10px; }
  .empty .btn { margin-top: 14px; }

  /* ---------- 成員畫面 ---------- */
  .solo { padding-top: 40px; }
  .solo .ticket { overflow: visible; }
  .solo .ticket .main { padding-top: 26px; }
  .result-msg { padding: 18px 22px 22px; }
  .result-msg p { margin: 0; }
  .result-msg .muted { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .stamp { position: absolute; right: 18px; top: 18px; width: 96px; height: 96px; border: 4px solid var(--stamp); border-radius: 50%; color: var(--stamp); display: grid; place-items: center; font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: .08em; transform: rotate(-14deg); opacity: .9; background: rgba(255,255,255,.6); }
  .stamp::before { content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--stamp); border-radius: 50%; }
  .stamp.ink { border-color: var(--ink-2); color: var(--ink-2); }
  .stamp.ink::before { border-color: var(--ink-2); }
  .stamp.land { animation: land .42s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes land { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .9; } }
  .solo .ticket .title { padding-right: 100px; }
  .warn { background: #FBECEC; color: #8E1F27; font-size: 14px; padding: 10px 12px; border-radius: 10px; margin: 0 0 12px; }

  .loading { text-align: center; color: var(--ink-2); padding: 80px 0; }
  .loading .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); margin: 0 4px; animation: blink 1s infinite; }
  .loading .dot:nth-child(2) { animation-delay: .15s; } .loading .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  code.uid { display: block; word-break: break-all; background: var(--sky); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 12px 0; }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .stamp.land, .loading .dot { animation: none; }
    .toast { transition: none; }
  }
</style>
</head>
<body>
<main id="app"><div class="loading" role="status"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ======== 只需要改這兩行 ======== */
const LIFF_ID = '請填入 LIFF ID';
const GAS_URL = '請填入 Apps Script 網頁應用程式網址';
/* ================================ */

const PARAMS = new URLSearchParams(location.search);
// LIFF 還沒設定，或網址帶 ?demo 時，用範例資料預覽畫面
const DEMO = LIFF_ID.startsWith('請填') || PARAMS.has('demo');

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const view = html => { $app.innerHTML = html; window.scrollTo(0, 0); };
const loading = () => `<div class="loading" role="status"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
const isHttps = u => /^https:\/\//.test(u || '');

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------- 預覽模式用的假資料 ---------- */
const demoStore = {
  me: { userId: 'Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', displayName: '預覽使用者', isPublisher: true },
  events: [
    { id: 'E2611080001', title: '週六河濱淨灘', date: '11/8（六）08:30', place: '大稻埕碼頭 5 號水門', desc: '手套和夾子現場提供，請自備水壺。', image: '', button: '我要報名', open: true, count: 18 },
    { id: 'E2611010001', title: '十一月讀書會：《被討厭的勇氣》', date: '11/1（六）14:00', place: '活動中心二樓', desc: '', image: '', button: '我要參加', open: false, count: 9 },
  ],
};
if (DEMO) {
  window.liff = { isInClient: () => false, closeWindow() {}, isApiAvailable: () => false };
}

async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  const body = { action, ...data };
  if (action !== 'event') body.idToken = liff.getIDToken();
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'TOKEN_EXPIRED') { liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入'); }
    throw new Error(j.error);
  }
  return j;
}

async function demoApi(action, data) {
  await new Promise(r => setTimeout(r, 350));
  const ev = demoStore.events[0];
  switch (action) {
    case 'me': return { ok: true, ...demoStore.me };
    case 'listEvents': return { ok: true, events: demoStore.events };
    case 'createEvent': {
      const e = { ...data.event, id: 'E' + Date.now(), open: true, count: 0 };
      demoStore.events.unshift(e); return { ok: true, event: e };
    }
    case 'setOpen': {
      const e = demoStore.events.find(x => x.id === data.eventId); e.open = data.open; return { ok: true, event: e };
    }
    case 'register': {
      const s = PARAMS.get('demo');
      if (s === 'bind') return { ok: true, status: 'need_bind', event: ev };
      if (s === 'already') return { ok: true, status: 'already', name: '王小明', event: ev };
      if (s === 'closed') return { ok: true, status: 'closed', event: { ...ev, open: false } };
      return { ok: true, status: 'registered', name: '王小明', event: ev };
    }
    case 'bind': return { ok: true, status: 'registered', name: data.name || '王小明', event: ev };
  }
}

/* ---------- 入口 ---------- */
async function main() {
  try {
    if (!DEMO) {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    }
    const eventId = new URLSearchParams(location.search).get('event');
    const demoMember = DEMO && ['member', 'bind', 'already', 'closed'].includes(PARAMS.get('demo'));
    if (eventId || demoMember) await memberFlow(eventId || 'demo');
    else await publisherFlow();
  } catch (e) {
    view(`<section class="solo">${ticket({ title: '無法開啟' }, `<div class="result-msg"><p>${esc(e.message)}</p><p class="muted">請關閉後從 LINE 重新開啟一次。</p></div>`)}</section>`);
  }
}

/* ---------- 共用：票券 ---------- */
function ticket(ev, stubHtml, extra = '') {
  const meta = [];
  if (ev.date) meta.push(`<dt>時間</dt><dd>${esc(ev.date)}</dd>`);
  if (ev.place) meta.push(`<dt>地點</dt><dd>${esc(ev.place)}</dd>`);
  return `<article class="ticket">
    ${extra}
    ${isHttps(ev.image) ? `<img class="hero" src="${esc(ev.image)}" alt="" onerror="this.remove()">` : ''}
    <div class="main">
      <h2 class="title ${ev.title ? '' : 'empty'}">${esc(ev.title || '活動名稱')}</h2>
      ${meta.length ? `<dl>${meta.join('')}</dl>` : ''}
      ${ev.desc ? `<p class="desc">${esc(ev.desc)}</p>` : ''}
    </div>
    <div class="perf" aria-hidden="true"></div>
    ${stubHtml}
  </article>`;
}

/* ================= 成員：一鍵報名 ================= */
async function memberFlow(eventId) {
  view(loading());
  showResult(await api('register', { eventId }), eventId);
}

function showResult(r, eventId) {
  const ev = r.event || {};
  const done = (stamp, cls, line, sub) => view(`<section class="solo">
      ${ticket(ev, `<div class="result-msg"><p>${line}</p>${sub ? `<p class="muted">${sub}</p>` : ''}</div>`,
        `<div class="stamp land ${cls}" aria-hidden="true">${stamp}</div>`)}
      ${liff.isInClient() ? `<button class="btn plain" style="margin-top:18px" onclick="liff.closeWindow()">回到聊天室</button>` : ''}
    </section>`);
  switch (r.status) {
    case 'registered':  done('已報名', '', `${esc(r.name)}，報名完成。`, '主辦人已經收到你的報名。'); break;
    case 'already':     done('已報名', '', `${esc(r.name)}，你之前就報名了。`, '不用再按一次。'); break;
    case 'closed':      done('截止', 'ink', '這個活動已經停止報名。', '有問題請直接聯絡主辦人。'); break;
    case 'need_bind':   bindForm(eventId, ev); break;
    case 'not_found':   bindForm(eventId, ev, '名單裡找不到這組姓名和手機。請確認輸入正確，或聯絡主辦人把你加進名單。'); break;
    case 'bound_other': done('待確認', 'ink', '這筆名單資料已經綁定另一個 LINE 帳號。', '請聯絡主辦人協助處理。'); break;
    default:            done('錯誤', 'ink', '收到無法辨識的回應。', '請稍後再試一次。');
  }
}

function bindForm(eventId, ev, warn = '') {
  view(`<section class="solo">
    ${ticket(ev, `<div class="result-msg">
        <p><b>第一次報名，請確認身分</b></p>
        <p class="muted" style="margin-bottom:14px">只要填這一次，之後按圖卡就直接報名。</p>
        ${warn ? `<p class="warn" role="alert">${esc(warn)}</p>` : ''}
        <label class="field"><span>姓名</span><input id="f-name" autocomplete="name"></label>
        <label class="field"><span>手機</span><input id="f-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678"></label>
        <button id="f-go" class="btn send" style="margin-top:6px">確認並報名</button>
      </div>`)}
  </section>`);
  const btn = document.getElementById('f-go');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '確認中';
    try {
      showResult(await api('bind', { eventId, name: document.getElementById('f-name').value, phone: document.getElementById('f-phone').value }), eventId);
    } catch (e) {
      toast(e.message); btn.disabled = false; btn.textContent = '確認並報名';
    }
  };
}

/* ================= 發布者平台 ================= */
let ME = null, EVENTS = [], TAB = 'new';
const draft = { title: '', date: '', place: '', desc: '', image: '', button: '我要報名' };

async function publisherFlow() {
  view(loading());
  ME = await api('me');
  if (!ME.isPublisher) {
    view(`<section class="solo">${ticket({ title: '還沒有發布權限' }, `<div class="result-msg">
        <p>把下面這串代碼交給管理員，貼到試算表「發布者」工作表的第一欄，再重新開啟這個頁面。</p>
        <code class="uid">${esc(ME.userId)}</code>
        <button class="btn plain" id="copy">複製代碼</button></div>`)}</section>`);
    document.getElementById('copy').onclick = () => navigator.clipboard.writeText(ME.userId).then(() => toast('已複製代碼'));
    return;
  }
  await refreshEvents();
  render();
}

async function refreshEvents() {
  try { EVENTS = (await api('listEvents')).events; } catch (e) { toast(e.message); }
}

function render() {
  view(`
    <header class="top"><h1>報名圖卡</h1><span class="who">${esc(ME.displayName)}</span></header>
    ${DEMO ? `<p class="demo-note">預覽模式：目前使用範例資料，設定好 LINE 後就會換成真的。</p>` : ''}
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="${TAB === 'new'}" data-tab="new">新活動</button>
      <button role="tab" aria-selected="${TAB === 'sent'}" data-tab="sent">已發布<span class="n">${EVENTS.length}</span></button>
    </nav>
    <div id="panel"></div>
    <div class="dock" id="dock" ${TAB === 'new' ? '' : 'hidden'}><div class="inner"><button class="btn send" id="send">發送到 LINE 群組</button></div></div>`);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });
  if (TAB === 'new') renderCompose(); else renderSent();
}

function renderCompose() {
  const f = (k, label, attrs = '', help = '') => `<label class="field"><span>${label}</span><input id="e-${k}" value="${esc(draft[k])}" ${attrs}>${help ? `<div class="help">${help}</div>` : ''}</label>`;
  document.getElementById('panel').innerHTML = `
    <div id="pv"></div>
    <p class="caption">群組裡的人會看到這張圖卡</p>
    <div class="group"><h2>活動</h2>
      ${f('title', '活動名稱', 'maxlength="60" required')}
      <div class="row2">${f('date', '時間', 'placeholder="11/20（五）19:00"')}${f('place', '地點')}</div>
    </div>
    <div class="group"><h2>內容</h2>
      <label class="field"><span>說明</span><textarea id="e-desc" maxlength="300" placeholder="要帶什麼、怎麼集合、聯絡誰">${esc(draft.desc)}</textarea></label>
      ${f('image', '圖片網址', 'type="url" inputmode="url" placeholder="https://"', '選填。要用 https 開頭、公開的圖片連結。')}
      ${f('button', '按鈕文字', 'maxlength="20"')}
    </div>`;
  Object.keys(draft).forEach(k => document.getElementById('e-' + k).addEventListener('input', e => { draft[k] = e.target.value; preview(); }));
  preview();
  document.getElementById('send').onclick = createAndSend;
}

function preview() {
  const ev = { ...draft, title: draft.title.trim() };
  document.getElementById('pv').innerHTML = ticket(ev,
    `<div class="stub"><span class="notch"></span><span class="fake-btn">${esc(draft.button.trim() || '我要報名')}</span></div>`);
}

function renderSent() {
  const panel = document.getElementById('panel');
  if (!EVENTS.length) {
    panel.innerHTML = `<div class="empty"><p>還沒有發布過活動。</p><button class="btn send" id="go-new">建立第一個活動</button></div>`;
    document.getElementById('go-new').onclick = () => { TAB = 'new'; render(); };
    return;
  }
  panel.innerHTML = `<div class="stubs">${EVENTS.map((e, i) => `
    <article class="stub-card">
      <div class="info">
        <div class="t">${esc(e.title)}</div>
        ${e.date ? `<div class="d">${esc(e.date)}</div>` : ''}
        <span class="state ${e.open ? '' : 'off'}">${e.open ? '報名中' : '已截止'}</span>
      </div>
      <div class="count"><b>${e.count}</b><small>人報名</small></div>
      <div class="acts">
        <button class="go" data-share="${i}">再發送一次</button>
        <button data-toggle="${i}">${e.open ? '停止報名' : '重新開放'}</button>
      </div>
    </article>`).join('')}</div>`;
  panel.querySelectorAll('[data-share]').forEach(b => b.onclick = () => share(EVENTS[b.dataset.share]));
  panel.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const e = EVENTS[b.dataset.toggle]; b.disabled = true;
    try { await api('setOpen', { eventId: e.id, open: !e.open }); e.open = !e.open; toast(e.open ? '已重新開放報名' : '已停止報名'); renderSent(); }
    catch (err) { toast(err.message); b.disabled = false; }
  });
}

async function createAndSend() {
  if (!draft.title.trim()) { toast('請先填活動名稱'); document.getElementById('e-title').focus(); return; }
  const btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = '建立中';
  try {
    const { event } = await api('createEvent', { event: { ...draft, button: draft.button.trim() || '我要報名' } });
    btn.textContent = '選擇群組';
    await share(event);
    Object.assign(draft, { title: '', date: '', place: '', desc: '', image: '', button: '我要報名' });
    await refreshEvents();
    TAB = 'sent'; render();
  } catch (e) {
    toast(e.message); btn.disabled = false; btn.textContent = '發送到 LINE 群組';
  }
}

async function share(ev) {
  if (DEMO) { toast('預覽模式：設定好 LINE 後，這裡會跳出群組選單'); return false; }
  if (!liff.isApiAvailable('shareTargetPicker')) { toast('無法開啟群組選單，請確認 LIFF 已開啟 Share target picker'); return false; }
  try {
    const res = await liff.shareTargetPicker([buildFlex(ev)], { isMultiple: true });
    toast(res ? '已發送到群組' : '已取消發送，可以在「已發布」再發送');
    return !!res;
  } catch (e) {
    toast('發送失敗：' + e.message); return false;
  }
}

/* ================= 群組裡的圖卡（Flex Message） ================= */
function buildFlex(ev) {
  const url = `https://liff.line.me/${LIFF_ID}?event=${encodeURIComponent(ev.id)}`;
  const info = (k, v) => ({ type: 'box', layout: 'baseline', spacing: 'md', contents: [
    { type: 'text', text: k, color: '#56627A', size: 'sm', flex: 0 },
    { type: 'text', text: String(v), wrap: true, color: '#1C2840', size: 'sm', flex: 1 } ] });

  const body = [{ type: 'text', text: ev.title, weight: 'bold', size: 'xl', wrap: true, color: '#1C2840' }];
  const meta = [];
  if (ev.date) meta.push(info('時間', ev.date));
  if (ev.place) meta.push(info('地點', ev.place));
  if (meta.length) body.push({ type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: meta });
  if (ev.desc) body.push({ type: 'text', text: ev.desc, size: 'sm', color: '#56627A', wrap: true, margin: 'lg' });

  const bubble = {
    type: 'bubble',
    body: { type: 'box', layout: 'vertical', paddingAll: '20px', contents: body },
    footer: { type: 'box', layout: 'horizontal', spacing: 'md', paddingAll: '16px',
      contents: [
        { type: 'box', layout: 'vertical', width: '6px', cornerRadius: '3px', backgroundColor: '#F2B632', contents: [] },
        { type: 'button', style: 'primary', color: '#06C755', height: 'sm', flex: 1,
          action: { type: 'uri', label: (ev.button || '我要報名').slice(0, 20), uri: url } } ] },
  };
  if (isHttps(ev.image)) {
    bubble.hero = { type: 'image', url: ev.image, size: 'full', aspectRatio: '20:13', aspectMode: 'cover', action: { type: 'uri', uri: url } };
  }
  return { type: 'flex', altText: `【報名】${ev.title}`.slice(0, 400), contents: bubble };
}

main();
</script>
